<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Activities</title>
  <link rel="stylesheet" href="style.css">
  <script src="hikes.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Hikes</h1>
  <div class="search">
    <label for="search">Search hikes:</label>
    <input id="search" type="text" placeholder="name, description, or tag">
    <button id="search-button">Search</button>
  </div>
  <div id="hike-container">
    <!-- sample card; replaced by script.js -->
    <div class="hike-card">
      <img src="" alt="Teton Canyon">
      <div class="hike-content">
        <h2>Teton Canyon</h2>
        <p>Distance: 3 miles</p>
        <p class="hike-tags">Canyon, Tetons</p>
        <span class="rating" role="img" aria-label="Difficulty: 1 out of 5">🥾▫▫▫▫</span>
      </div>
    </div>
  </div>
</body>
</html>
