<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Book</title>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your Title" />
    <meta property="og:description" content="Your Description" />
    <meta property="og:url" content="Your URL" />
    <meta property="og:image" content="images/social-preview-image.png" />

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image" />
    <meta name="twitter:title" content="Your Title" />
    <meta name="twitter:description" content="Your Description" />
    <meta name="twitter:image" content="images/social-preview-image.png" />

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="images/favicon.ico" />

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="images/recipe-book.png" alt="Recipe Book logo" />
      <h1>RecipeBook</h1>
    </header>

    <form class="search" role="search">
      <input
        type="search"
        id="search"
        name="search"
        placeholder="Find a recipe"
        aria-label="Find a recipe"
      />
      <button type="submit"><img src="images/search.svg" alt="Search" /></button>
    </form>

    <main>
      <article class="recipe">
        <img
          class="recipe-image"
          src="images/apple-crisp.jpg"
          alt="Apple crisp topped with vanilla ice cream"
        />
        <div class="recipe-info">
          <ul class="tags">
            <li><button>dessert</button></li>
          </ul>
          <h2>Apple Crisp</h2>
          <span
            class="rating"
            role="img"
            aria-label="Rating: 4 out of 5 stars"
          >
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
          </span>
          <p class="description">
            This apple crisp recipe is a simple yet delicious fall dessert
            that's great served warm with vanilla ice cream.
          </p>
        </div>
      </article>
    </main>

    <footer>
      <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon" /></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon" /></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon" /></a>
      </div>
      <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons"
        >Recipe icons created by Freepik - Flaticon</a
      >
    </footer>
  </body>
</html>
